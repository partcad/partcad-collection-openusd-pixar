# PartCAD package: Pixar's OpenUSD sample assets as parts, served by a repository plugin.
#
# Published as //pub/collection/openusd/pixar/assets: this package is
# //pub/collection/openusd/pixar, and its one external dependency 'assets' is
# served by the pixar_repo plugin - a child package per archive openusd.org
# offers (kitchen-set, city-set, usdskel-examples), a part per asset in it, each
# 'type: usd', built by PartCAD's own part type of that name.
name: //pub/collection/openusd/pixar

desc: |
  Pixar's OpenUSD sample assets (https://openusd.org/release/dl_downloads.html)
  as PartCAD parts: the Kitchen Set and each of its props, the City Set, and
  the UsdSkel examples' HumanFemale. No geometry is vendored: every asset is
  fetched from openusd.org when it is first built, once you have accepted
  Pixar's licence for it (see the README).
url: https://openusd.org/release/dl_downloads.html

# The first release whose //builtin has the 'usd' part type every part here
# is.
partcad: ">=0.9.11"

# Props and scenes made to be looked at: nothing in them says they are made to
# be manufactured. The plugin says the same of 'assets' in its metadata.
manufacturable: false

docs:
  name: Pixar's OpenUSD sample assets for PartCAD
  usage: |
    ```shell
    pc list parts //pub/collection/openusd/pixar/assets/kitchen-set
    pc search parts -P '//pub/collection/openusd/pixar/assets...' -k kettle
    pc inspect //pub/collection/openusd/pixar/assets/kitchen-set:Bowl
    pc inspect //pub/collection/openusd/pixar/assets/kitchen-set:Kitchen_set
    pc inspect "//pub/collection/openusd/pixar/assets/usdskel-examples:HumanFemale_walk;time=115"
    ```

dependencies:
  assets:
    type: external
    plugin: :pixar_repo
    desc: Pixar's OpenUSD sample assets, a child package per archive and a part per asset.

repositories:
  pixar_repo:
    type: basic
    path: pixar_repo.py
    desc: Serves Pixar's OpenUSD sample assets from openusd.org as 'usd' parts.
    # Every parameter here is yours to change without touching this package,
    # in your own ~/.partcad/config.yaml, under 'parameters', by the plugin's
    # name:
    #
    #   parameters:
    #     //pub/collection/openusd/pixar:pixar_repo:
    #       accept_license: true
    #       textures: true
    #
    # 'textures' and 'max_size_mb' may also be set in a package of your own,
    # with an enrich of the plugin (see the README); 'accept_license' is yours
    # alone, and never a package's.
    parameters:
      accept_license:
        type: bool
        default: false
        desc: >-
          Whether you accept Pixar's USD Asset End User License Agreement
          (https://openusd.org/release/dl_kitchen_set.html), which these
          assets are offered under: a temporary, revocable licence for your
          personal, non-commercial testing of USD. Nothing is fetched until
          you do. Set it in your own ~/.partcad/config.yaml; never in a
          package.
      looks:
        type: bool
        default: true
        desc: >-
          Whether a part's USDZ carries what its look is read from: the
          shaders its layers name, and the images of its colour, roughness
          and metalness, each of up to 8 MB. PartCAD's 'usd' part type
          colours each face from them. 'false' carries the layers alone.
      textures:
        type: bool
        default: false
        desc: >-
          Whether a part's USDZ carries every texture its layers name, each
          as it is - normal maps and all - for a package complete enough to
          open in another USD application. PartCAD needs only what 'looks'
          carries.
      max_size_mb:
        type: float
        default: 512
        desc: >-
          The most a part's USDZ may be, in MB: it crosses to PartCAD in one
          answer. An asset larger than this is refused, saying so.
